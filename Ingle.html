<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Sentence Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:      #F5F2EC;
      --bg-card:      #FFFFFF;
      --bg-muted:     #F0EDE7;
      --bg-dark:      #1C1917;
      --accent:       #2A6B4F;
      --accent-light: #E4F0EB;
      --accent-dark:  #1A4A35;
      --blue:         #1D4E89;
      --blue-light:   #E3EEF9;
      --amber:        #92580A;
      --amber-light:  #FEF3E2;
      --red:          #B91C1C;
      --red-light:    #FEE2E2;
      --text-primary: #1C1917;
      --text-sec:     #57534E;
      --text-muted:   #A8A29E;
      --border:       rgba(28,25,23,0.10);
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app { min-height: 100vh; padding: 24px 16px 56px; }

    .container { max-width: 760px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      background: var(--bg-card);
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 22px 24px;
      margin-bottom: 22px;
    }

    .header-top {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-title {
      font-family: 'Lora', serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-sub {
      font-size: 14px;
      color: var(--text-sec);
      margin-top: 5px;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* Speed */
    .speed-group {
      display: flex;
      background: var(--bg-muted);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
    }

    .speed-btn {
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.18s;
      background: transparent;
      color: var(--text-sec);
      font-family: 'DM Sans', sans-serif;
    }

    .speed-btn:hover { background: rgba(0,0,0,0.06); color: var(--text-primary); }

    .speed-btn.active {
      background: var(--bg-dark);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Status */
    .status {
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .status.ready  { background: var(--accent-light); color: var(--accent-dark); border-color: rgba(42,107,79,0.2); }
    .status.loading { background: var(--amber-light); color: var(--amber); border-color: rgba(146,88,10,0.2); }

    /* Stop */
    .stop-btn {
      padding: 6px 16px;
      border-radius: 14px;
      background: var(--red-light);
      color: var(--red);
      border: 1px solid rgba(185,28,28,0.2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
    }

    .stop-btn:hover { background: #FCA5A5; }

    /* ── Cards ── */
    .cards-list { display: flex; flex-direction: column; gap: 14px; }

    .phrase-card {
      background: var(--bg-card);
      border-radius: 24px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      transition: box-shadow 0.25s, border-color 0.25s;
    }

    .phrase-card:hover { box-shadow: var(--shadow-md); }

    .phrase-card.playing {
      border-color: var(--accent);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(42,107,79,0.10);
    }

    .card-inner { display: flex; flex-direction: column; gap: 16px; }

    /* Badges */
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-num  { background: var(--bg-dark); color: #fff; }
    .badge-svo  { background: var(--blue-light); color: var(--blue); }
    .badge-play {
      background: var(--accent-light);
      color: var(--accent-dark);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* Texto */
    .phrase-en {
      font-family: 'Lora', serif;
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .phrase-pt {
      font-family: 'Lora', serif;
      font-size: 15px;
      font-style: italic;
      color: var(--text-sec);
      margin-top: 4px;
    }

    /* Estrutura */
    .structure {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 12px;
    }

    .structure-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .structure-text {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--text-sec);
      line-height: 1.6;
    }

    /* Botões */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .action-btn {
      flex: 1;
      min-width: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }

    .action-btn:active { transform: scale(0.97); }

    .btn-listen             { background: var(--bg-dark); color: #fff; }
    .btn-listen:hover       { background: #292524; }
    .btn-listen.is-playing  { background: var(--accent); }
    .btn-slow               { background: var(--bg-muted); color: var(--text-sec); }
    .btn-slow:hover         { background: #E7E4DC; color: var(--text-primary); }
    .btn-copy               { background: var(--bg-muted); color: var(--text-sec); }
    .btn-copy:hover         { background: #E7E4DC; color: var(--text-primary); }
    .btn-copy.copied        { background: var(--accent-light); color: var(--accent-dark); }

    /* Footer */
    .footer {
      margin-top: 36px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; }

    /* Desktop */
    @media (min-width: 640px) {
      .app { padding: 40px 24px 64px; }
      .header-top { flex-direction: row; align-items: flex-start; justify-content: space-between; }
      .card-inner { flex-direction: row; align-items: center; }
      .card-content { flex: 1; min-width: 0; }
      .actions { flex-direction: column; min-width: 148px; flex-wrap: nowrap; }
      .action-btn { flex: unset; min-width: unset; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {

      /* =====================================================
          COMO ADICIONAR NOVAS FRASES
      =====================================================

      Copie um bloco abaixo e altere:

        id:          Número da frase (ex: '11')
        english:     Frase em inglês
        portuguese:  Tradução em português
        structure:   Estrutura da frase

      EXEMPLO:

      {
        id: '11',
        english: 'I study English every day.',
        portuguese: 'Eu estudo inglês todos os dias.',
        structure: 'I + study + English + every day [time]'
      },

      */

      const frases = [
        {
          id: '01',
          english: 'I drink water every day.',
          portuguese: 'Eu bebo água todo dia.',
          structure: 'I [subject] + drink [verb] + water [object] + every day [time]'
        },
        {
          id: '02',
          english: 'He works at a big company.',
          portuguese: 'Ele trabalha em uma grande empresa.',
          structure: 'He + works + at a big company [place]'
        },
        {
          id: '03',
          english: 'We watch movies on the weekend.',
          portuguese: 'Nós assistimos filmes no fim de semana.',
          structure: 'We + watch + movies + on the weekend [time/place]'
        },
        {
          id: '04',
          english: 'She buys food at the market.',
          portuguese: 'Ela compra comida no mercado.',
          structure: 'She + buys + food + at the market [place]'
        },
        {
          id: '05',
          english: 'They live in São Paulo.',
          portuguese: 'Eles moram em São Paulo.',
          structure: 'They + live + in São Paulo [place]'
        },
        {
          id: '06',
          english: 'I use my phone on the bus.',
          portuguese: 'Eu uso meu celular no ônibus.',
          structure: 'I + use + my phone + on the bus [place]'
        },
        {
          id: '07',
          english: 'She studies English at night.',
          portuguese: 'Ela estuda inglês à noite.',
          structure: 'She + studies + English + at night [time]'
        },
        {
          id: '08',
          english: 'My brother cooks really well.',
          portuguese: 'Meu irmão cozinha muito bem.',
          structure: 'My brother [subject] + cooks + really well [adverb]'
        },
        {
          id: '09',
          english: 'We drink coffee in the morning.',
          portuguese: 'Nós bebemos café de manhã.',
          structure: 'We + drink + coffee + in the morning [time]'
        },
        {
          id: '10',
          english: 'I take the subway every day.',
          portuguese: 'Eu pego o metrô todo dia.',
          structure: 'I + take + the subway + every day [time]'
        }
      ];

      /* =====================================================
          CONFIGURAÇÕES DE VOZ
      =====================================================
        rate:  velocidade — 0.7 lento | 0.9 normal | 1.2 rápido
        pitch: tom da voz (1 = padrão)
        lang:  idioma
      */
      const voiceConfig = { lang: 'en-US', rate: 0.85, pitch: 1 };

      const [playing, setPlaying]         = useState(null);
      const [copied,  setCopied]          = useState(null);
      const [voicesReady, setVoicesReady] = useState(false);
      const [speed, setSpeed]             = useState(voiceConfig.rate);
      const voiceRef = useRef(null);

      useEffect(() => {
        const load = () => {
          const voices = speechSynthesis.getVoices();
          if (voices.length > 0) {
            voiceRef.current =
              voices.find(v => v.lang === 'en-US' && v.name.includes('Female')) ||
              voices.find(v => v.lang === 'en-US') ||
              voices[0];
            setVoicesReady(true);
          }
        };
        load();
        speechSynthesis.addEventListener('voiceschanged', load);
        return () => speechSynthesis.removeEventListener('voiceschanged', load);
      }, []);

      const speak = (text, id) => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang  = voiceConfig.lang;
        u.rate  = speed;
        u.pitch = voiceConfig.pitch;
        if (voiceRef.current) u.voice = voiceRef.current;
        u.onstart = () => setPlaying(id);
        u.onend   = () => setPlaying(null);
        u.onerror = () => setPlaying(null);
        speechSynthesis.speak(u);
      };

      const stopAudio = () => { speechSynthesis.cancel(); setPlaying(null); };

      const copyText = (text, id) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopied(id);
          setTimeout(() => setCopied(null), 2000);
        });
      };

      const speeds = [
        { label: 'Slow',   value: 0.7 },
        { label: 'Normal', value: 0.9 },
        { label: 'Fast',   value: 1.2 },
      ];

      return (
        <div className="app">
          <div className="container">

            {/* Header */}
            <div className="header">
              <div className="header-top">
                <div>
                  <h1 className="header-title">
                    <span className="header-icon">🎧</span>
                    English Sentence Study
                  </h1>
                  <p className="header-sub">
                    Ouça, leia a estrutura e pratique os sons do inglês.
                  </p>
                </div>

                <div className="header-controls">
                  <div className="speed-group">
                    {speeds.map(s => (
                      <button
                        key={s.value}
                        onClick={() => setSpeed(s.value)}
                        className={`speed-btn${speed === s.value ? ' active' : ''}`}
                      >
                        {s.label}
                      </button>
                    ))}
                  </div>

                  <span className={`status ${voicesReady ? 'ready' : 'loading'}`}>
                    {voicesReady ? '🔊 Voice ready' : '⏳ Loading…'}
                  </span>

                  {playing && (
                    <button className="stop-btn" onClick={stopAudio}>■ Stop</button>
                  )}
                </div>
              </div>
            </div>

            {/* Frases */}
            <div className="cards-list">
              {frases.map((frase) => {
                const isPlaying = playing === frase.id;
                const isCopied  = copied  === frase.id;

                return (
                  <div key={frase.id} className={`phrase-card${isPlaying ? ' playing' : ''}`}>
                    <div className="card-inner">

                      <div className="card-content">
                        <div className="badges">
                          <span className="badge badge-num">{frase.id}</span>
                          <span className="badge badge-svo">SVO Structure</span>
                          {isPlaying && <span className="badge badge-play">♪ Playing</span>}
                        </div>

                        <p className="phrase-en">{frase.english}</p>
                        <p className="phrase-pt">{frase.portuguese}</p>

                        <div className="structure">
                          <div className="structure-label">Structure</div>
                          <p className="structure-text">{frase.structure}</p>
                        </div>
                      </div>

                      <div className="actions">
                        <button
                          className={`action-btn btn-listen${isPlaying ? ' is-playing' : ''}`}
                          onClick={() => speak(frase.english, frase.id)}
                        >
                          {isPlaying ? '♪ Playing' : '▶ Listen'}
                        </button>

                        <button
                          className="action-btn btn-slow"
                          onClick={() => {
                            speechSynthesis.cancel();
                            const u = new SpeechSynthesisUtterance(frase.english);
                            u.lang  = voiceConfig.lang;
                            u.rate  = 0.6;
                            u.pitch = voiceConfig.pitch;
                            if (voiceRef.current) u.voice = voiceRef.current;
                            u.onstart = () => setPlaying(frase.id + '_slow');
                            u.onend   = () => setPlaying(null);
                            u.onerror = () => setPlaying(null);
                            speechSynthesis.speak(u);
                          }}
                        >
                          🐢 Slow
                        </button>

                        <button
                          className={`action-btn btn-copy${isCopied ? ' copied' : ''}`}
                          onClick={() => copyText(frase.english, frase.id)}
                        >
                          {isCopied ? '✓ Copied!' : '⎘ Copy'}
                        </button>
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer */}
            <div className="footer">
              <span>React + Web Speech API</span>
              <span className="dot"></span>
              <span>{frases.length} sentences</span>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
