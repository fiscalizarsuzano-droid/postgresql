<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Sentence Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:      #F5F2EC;
      --bg-card:      #FFFFFF;
      --bg-muted:     #F0EDE7;
      --bg-dark:      #1C1917;
      --accent:       #2A6B4F;
      --accent-light: #E4F0EB;
      --accent-dark:  #1A4A35;
      --blue:         #1D4E89;
      --blue-light:   #E3EEF9;
      --amber:        #92580A;
      --amber-light:  #FEF3E2;
      --red:          #B91C1C;
      --red-light:    #FEE2E2;
      --text-primary: #1C1917;
      --text-sec:     #57534E;
      --text-muted:   #A8A29E;
      --border:       rgba(28,25,23,0.10);
      --shadow-sm:    0 1px 3px rgba(0,0,0,0.06);
      --shadow-md:    0 4px 12px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app { min-height: 100vh; padding: 24px 16px 56px; }

    .container { max-width: 760px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      background: var(--bg-card);
      border-radius: 28px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 22px 24px;
      margin-bottom: 22px;
    }

    .header-top {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-title {
      font-family: 'Lora', serif;
      font-size: clamp(20px, 5vw, 26px);
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 38px;
      height: 38px;
      background: var(--accent-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .header-sub {
      font-size: 14px;
      color: var(--text-sec);
      margin-top: 5px;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    /* Speed */
    .speed-group {
      display: flex;
      background: var(--bg-muted);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
    }

    .speed-btn {
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.18s;
      background: transparent;
      color: var(--text-sec);
      font-family: 'DM Sans', sans-serif;
    }

    .speed-btn:hover { background: rgba(0,0,0,0.06); color: var(--text-primary); }

    .speed-btn.active {
      background: var(--bg-dark);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Status */
    .status {
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .status.ready  { background: var(--accent-light); color: var(--accent-dark); border-color: rgba(42,107,79,0.2); }
    .status.loading { background: var(--amber-light); color: var(--amber); border-color: rgba(146,88,10,0.2); }

    /* Stop */
    .stop-btn {
      padding: 6px 16px;
      border-radius: 14px;
      background: var(--red-light);
      color: var(--red);
      border: 1px solid rgba(185,28,28,0.2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
    }

    .stop-btn:hover { background: #FCA5A5; }

    /* ── Cards ── */
    .cards-list { display: flex; flex-direction: column; gap: 14px; }

    .phrase-card {
      background: var(--bg-card);
      border-radius: 24px;
      border: 1.5px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      transition: box-shadow 0.25s, border-color 0.25s;
    }

    .phrase-card:hover { box-shadow: var(--shadow-md); }

    .phrase-card.playing {
      border-color: var(--accent);
      box-shadow: var(--shadow-md), 0 0 0 3px rgba(42,107,79,0.10);
    }

    .card-inner { display: flex; flex-direction: column; gap: 16px; }

    /* Badges */
    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-num  { background: var(--bg-dark); color: #fff; }
    .badge-svo  { background: var(--blue-light); color: var(--blue); }
    .badge-play {
      background: var(--accent-light);
      color: var(--accent-dark);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* Texto */
    .phrase-en {
      font-family: 'Lora', serif;
      font-size: clamp(18px, 4vw, 22px);
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .phrase-pt {
      font-family: 'Lora', serif;
      font-size: 15px;
      font-style: italic;
      color: var(--text-sec);
      margin-top: 4px;
    }

    /* Estrutura */
    .structure {
      background: var(--bg-muted);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      margin-top: 12px;
    }

    .structure-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .structure-text {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--text-sec);
      line-height: 1.6;
    }

    /* Botões */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .action-btn {
      flex: 1;
      min-width: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.18s;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap;
    }

    .action-btn:active { transform: scale(0.97); }

    .btn-listen             { background: var(--bg-dark); color: #fff; }
    .btn-listen:hover       { background: #292524; }
    .btn-listen.is-playing  { background: var(--accent); }
    .btn-slow               { background: var(--bg-muted); color: var(--text-sec); }
    .btn-slow:hover         { background: #E7E4DC; color: var(--text-primary); }
    .btn-copy               { background: var(--bg-muted); color: var(--text-sec); }
    .btn-copy:hover         { background: #E7E4DC; color: var(--text-primary); }
    .btn-copy.copied        { background: var(--accent-light); color: var(--accent-dark); }

    /* Footer */
    .footer {
      margin-top: 36px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dot { width: 3px; height: 3px; background: var(--text-muted); border-radius: 50%; }

    /* Desktop */
    @media (min-width: 640px) {
      .app { padding: 40px 24px 64px; }
      .header-top { flex-direction: row; align-items: flex-start; justify-content: space-between; }
      .card-inner { flex-direction: row; align-items: center; }
      .card-content { flex: 1; min-width: 0; }
      .actions { flex-direction: column; min-width: 148px; flex-wrap: nowrap; }
      .action-btn { flex: unset; min-width: unset; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {

      /* =====================================================
          COMO ADICIONAR NOVAS FRASES
      =====================================================

      Copie um bloco abaixo e altere:

        id:          Número da frase (ex: '11')
        english:     Frase em inglês
        portuguese:  Tradução em português
        structure:   Estrutura da frase

      EXEMPLO:

      {
        id: '11',
        english: 'I study English every day.',
        portuguese: 'Eu estudo inglês todos os dias.',
        structure: 'I + study + English + every day [time]'
      },

      */

      const frases = [
    // Estrutura SVO
    { id: '01', english: 'I drink water every day.', portuguese: 'Eu bebo água todo dia.', structure: 'I + drink + water + every day [tempo]' },
    { id: '02', english: 'He works at a big company.', portuguese: 'Ele trabalha numa empresa grande.', structure: 'He + works + at a big company' },
    { id: '03', english: 'We watch movies on the weekend.', portuguese: 'Nós assistimos filmes no fim de semana.', structure: 'We + watch + movies + on the weekend [tempo/lugar]' },
    { id: '04', english: 'She buys food at the market.', portuguese: 'Ela compra comida no mercado.', structure: 'She + buys + food + at the market [lugar]' },
    { id: '05', english: 'They live in São Paulo.', portuguese: 'Eles moram em São Paulo.', structure: 'They + live + in São Paulo [lugar]' },
    { id: '06', english: 'I use my phone on the bus.', portuguese: 'Eu uso o celular no transporte.', structure: 'I + use + my phone + on the bus [lugar]' },
    { id: '07', english: 'She studies English at night.', portuguese: 'Ela estuda inglês de noite.', structure: 'She + studies + English + at night [tempo]' },
    { id: '08', english: 'My brother cooks really well.', portuguese: 'Meu irmão cozinha muito bem.', structure: 'My brother + cooks + really well' },
    { id: '09', english: 'We drink coffee in the morning.', portuguese: 'Nós tomamos café de manhã.', structure: 'We + drink + coffee + in the morning [tempo]' },
    { id: '10', english: 'I take the subway every day.', portuguese: 'Eu pego o metrô todo dia.', structure: 'I + take + the subway + every day [tempo]' },
    { id: '11', english: 'He reads books before sleeping.', portuguese: 'Ele lê livros antes de dormir.', structure: 'He + reads + books + before sleeping [tempo]' },
    { id: '12', english: 'They eat pizza on Fridays.', portuguese: 'Eles comem pizza na sexta.', structure: 'They + eat + pizza + on Fridays [tempo]' },
    
    // Negação
    { id: '01', english: "I don't like cold weather.", portuguese: 'Eu não gosto de frio.', structure: "I + don't + like + cold weather" },
    { id: '02', english: "She doesn't eat meat.", portuguese: 'Ela não come carne.', structure: "She + doesn't + eat + meat" },
    { id: '03', english: "We didn't go to the party.", portuguese: 'Nós não fomos à festa.', structure: "We + didn't + go + to the party" },
    { id: '04', english: "He doesn't work on Saturdays.", portuguese: 'Ele não trabalha aos sábados.', structure: "He + doesn't + work + on Saturdays" },
    { id: '05', english: "I didn't hear the alarm.", portuguese: 'Eu não ouvi o alarme.', structure: "I + didn't + hear + the alarm" },
    { id: '06', english: "They didn't study yesterday.", portuguese: 'Eles não estudaram ontem.', structure: "They + didn't + study + yesterday [tempo]" },
    { id: '07', english: "She won't go to work tomorrow.", portuguese: 'Ela não vai ao trabalho amanhã.', structure: "She + won't + go + to work + tomorrow" },
    { id: '08', english: "I don't understand this word.", portuguese: 'Eu não entendo essa palavra.', structure: "I + don't + understand + this word" },
    { id: '09', english: "My phone doesn't have signal.", portuguese: 'Meu celular não tem sinal.', structure: "My phone + doesn't + have + signal" },
    { id: '10', english: "We haven't seen that movie yet.", portuguese: 'Nós não vimos aquele filme ainda.', structure: "We + haven't + seen + that movie + yet" },
    
    // Perguntas
    { id: '01', english: 'Do you like music?', portuguese: 'Você gosta de música?', structure: 'Do + you + like + music?' },
    { id: '02', english: 'Does she work here?', portuguese: 'Ela trabalha aqui?', structure: 'Does + she + work + here?' },
    { id: '03', english: 'Did you go to the market?', portuguese: 'Você foi ao mercado?', structure: 'Did + you + go + to the market?' },
    { id: '04', english: 'Do they live nearby?', portuguese: 'Eles moram perto?', structure: 'Do + they + live + nearby?' },
    { id: '05', english: 'Can you help me?', portuguese: 'Você pode me ajudar?', structure: 'Can + you + help + me?' },
    { id: '06', english: 'Will she come tomorrow?', portuguese: 'Ela vai vir amanhã?', structure: 'Will + she + come + tomorrow?' },
    { id: '07', english: 'Do you have a phone?', portuguese: 'Você tem um celular?', structure: 'Do + you + have + a phone?' },
    { id: '08', english: 'Did he eat already?', portuguese: 'Ele comeu já?', structure: 'Did + he + eat + already?' },
    { id: '09', english: 'Do you speak English?', portuguese: 'Você fala inglês?', structure: 'Do + you + speak + English?' },
    { id: '10', english: 'Where do you live?', portuguese: 'Onde você mora?', structure: 'Where + do + you + live?' },
    { id: '11', english: 'What time is it?', portuguese: 'Que horas são?', structure: 'What time + is + it?' },
    { id: '12', english: 'What is your name?', portuguese: 'Qual é o seu nome?', structure: 'What + is + your name?' },
    
    // Adjetivos antes do substantivo
    { id: '01', english: 'A long day.', portuguese: 'Um dia longo.', structure: 'adjetivo [long] + substantivo [day]' },
    { id: '02', english: 'A delicious meal.', portuguese: 'Uma comida gostosa.', structure: 'adjetivo [delicious] + substantivo [meal]' },
    { id: '03', english: 'A noisy stretch.', portuguese: 'Um trecho barulhento.', structure: 'adjetivo [noisy] + substantivo [stretch]' },
    { id: '04', english: 'I have an old phone.', portuguese: 'Eu tenho um celular velho.', structure: 'I + have + adjetivo [old] + substantivo [phone]' },
    { id: '05', english: 'She uses a black backpack.', portuguese: 'Ela usa uma mochila preta.', structure: 'She + uses + adjetivo [black] + substantivo [backpack]' },
    { id: '06', english: 'We live in a big city.', portuguese: 'Nós moramos numa cidade grande.', structure: 'We + live in + adjetivo [big] + substantivo [city]' },
    { id: '07', english: 'He has a difficult job.', portuguese: 'Ele tem um trabalho difícil.', structure: 'He + has + adjetivo [difficult] + substantivo [job]' },
    { id: '08', english: 'She is a smart person.', portuguese: 'Ela é uma pessoa inteligente.', structure: 'She + is + adjetivo [smart] + substantivo [person]' },
    { id: '09', english: 'Today was a hot day.', portuguese: 'Hoje foi um dia quente.', structure: 'Today + was + adjetivo [hot] + substantivo [day]' },
    { id: '10', english: 'I need a comfortable chair.', portuguese: 'Eu preciso de uma cadeira confortável.', structure: 'I + need + adjetivo [comfortable] + substantivo [chair]' },
    
    // Tempos verbais
    { id: '01', english: 'I work every day.', portuguese: 'Eu trabalho todos os dias.', structure: 'sujeito + verbo simples → presente' },
    { id: '02', english: 'She is working now.', portuguese: 'Ela está trabalhando agora.', structure: 'She + is + working [verbo-ing] → presente contínuo' },
    { id: '03', english: 'We went to the cinema yesterday.', portuguese: 'Nós fomos ao cinema ontem.', structure: 'We + went [irregular] + yesterday → passado' },
    { id: '04', english: 'I will study tomorrow.', portuguese: 'Eu vou estudar amanhã.', structure: 'I + will + study + tomorrow → futuro' },
    { id: '05', english: 'He is eating right now.', portuguese: 'Ele está comendo agora.', structure: 'He + is + eating [verbo-ing] → presente contínuo' },
    { id: '06', english: 'They traveled last week.', portuguese: 'Eles viajaram na semana passada.', structure: 'They + traveled [verbo-ed] + last week → passado' },
    { id: '07', english: 'You will learn English.', portuguese: 'Você vai aprender inglês.', structure: 'You + will + learn → futuro' },
    { id: '08', english: 'I am listening to music.', portuguese: 'Eu estou ouvindo música.', structure: 'I + am + listening [verbo-ing] → presente contínuo' },
    { id: '09', english: 'She arrived late yesterday.', portuguese: 'Ela chegou tarde ontem.', structure: 'She + arrived [verbo-ed] + late + yesterday → passado' },
    { id: '10', english: 'We will travel in July.', portuguese: 'Nós vamos viajar em julho.', structure: 'We + will + travel + in July → futuro' },
      ];

      /* =====================================================
          CONFIGURAÇÕES DE VOZ
      =====================================================
        rate:  velocidade — 0.7 lento | 0.9 normal | 1.2 rápido
        pitch: tom da voz (1 = padrão)
        lang:  idioma
      */
      const voiceConfig = { lang: 'en-US', rate: 0.85, pitch: 1 };

      const [playing, setPlaying]         = useState(null);
      const [copied,  setCopied]          = useState(null);
      const [voicesReady, setVoicesReady] = useState(false);
      const [speed, setSpeed]             = useState(voiceConfig.rate);
      const voiceRef = useRef(null);

      useEffect(() => {
        const load = () => {
          const voices = speechSynthesis.getVoices();
          if (voices.length > 0) {
            voiceRef.current =
              voices.find(v => v.lang === 'en-US' && v.name.includes('Female')) ||
              voices.find(v => v.lang === 'en-US') ||
              voices[0];
            setVoicesReady(true);
          }
        };
        load();
        speechSynthesis.addEventListener('voiceschanged', load);
        return () => speechSynthesis.removeEventListener('voiceschanged', load);
      }, []);

      const speak = (text, id) => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang  = voiceConfig.lang;
        u.rate  = speed;
        u.pitch = voiceConfig.pitch;
        if (voiceRef.current) u.voice = voiceRef.current;
        u.onstart = () => setPlaying(id);
        u.onend   = () => setPlaying(null);
        u.onerror = () => setPlaying(null);
        speechSynthesis.speak(u);
      };

      const stopAudio = () => { speechSynthesis.cancel(); setPlaying(null); };

      const copyText = (text, id) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopied(id);
          setTimeout(() => setCopied(null), 2000);
        });
      };

      const speeds = [
        { label: 'Slow',   value: 0.7 },
        { label: 'Normal', value: 0.9 },
        { label: 'Fast',   value: 1.2 },
      ];

      return (
        <div className="app">
          <div className="container">

            {/* Header */}
            <div className="header">
              <div className="header-top">
                <div>
                  <h1 className="header-title">
                    <span className="header-icon">🎧</span>
                    English Sentence Study
                  </h1>
                  <p className="header-sub">
                    Ouça, leia a estrutura e pratique os sons do inglês.
                  </p>
                </div>

                <div className="header-controls">
                  <div className="speed-group">
                    {speeds.map(s => (
                      <button
                        key={s.value}
                        onClick={() => setSpeed(s.value)}
                        className={`speed-btn${speed === s.value ? ' active' : ''}`}
                      >
                        {s.label}
                      </button>
                    ))}
                  </div>

                  <span className={`status ${voicesReady ? 'ready' : 'loading'}`}>
                    {voicesReady ? '🔊 Voice ready' : '⏳ Loading…'}
                  </span>

                  {playing && (
                    <button className="stop-btn" onClick={stopAudio}>■ Stop</button>
                  )}
                </div>
              </div>
            </div>

            {/* Frases */}
            <div className="cards-list">
              {frases.map((frase) => {
                const isPlaying = playing === frase.id;
                const isCopied  = copied  === frase.id;

                return (
                  <div key={frase.id} className={`phrase-card${isPlaying ? ' playing' : ''}`}>
                    <div className="card-inner">

                      <div className="card-content">
                        <div className="badges">
                          <span className="badge badge-num">{frase.id}</span>
                          <span className="badge badge-svo">SVO Structure</span>
                          {isPlaying && <span className="badge badge-play">♪ Playing</span>}
                        </div>

                        <p className="phrase-en">{frase.english}</p>
                        <p className="phrase-pt">{frase.portuguese}</p>

                        <div className="structure">
                          <div className="structure-label">Structure</div>
                          <p className="structure-text">{frase.structure}</p>
                        </div>
                      </div>

                      <div className="actions">
                        <button
                          className={`action-btn btn-listen${isPlaying ? ' is-playing' : ''}`}
                          onClick={() => speak(frase.english, frase.id)}
                        >
                          {isPlaying ? '♪ Playing' : '▶ Listen'}
                        </button>

                        <button
                          className="action-btn btn-slow"
                          onClick={() => {
                            speechSynthesis.cancel();
                            const u = new SpeechSynthesisUtterance(frase.english);
                            u.lang  = voiceConfig.lang;
                            u.rate  = 0.6;
                            u.pitch = voiceConfig.pitch;
                            if (voiceRef.current) u.voice = voiceRef.current;
                            u.onstart = () => setPlaying(frase.id + '_slow');
                            u.onend   = () => setPlaying(null);
                            u.onerror = () => setPlaying(null);
                            speechSynthesis.speak(u);
                          }}
                        >
                          🐢 Slow
                        </button>

                        <button
                          className={`action-btn btn-copy${isCopied ? ' copied' : ''}`}
                          onClick={() => copyText(frase.english, frase.id)}
                        >
                          {isCopied ? '✓ Copied!' : '⎘ Copy'}
                        </button>
                      </div>

                    </div>
                  </div>
                );
              })}
            </div>

            {/* Footer */}
            <div className="footer">
              <span>React + Web Speech API</span>
              <span className="dot"></span>
              <span>{frases.length} sentences</span>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
