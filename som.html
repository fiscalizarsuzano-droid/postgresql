<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organograma de Sentimentos</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

#toolbar {
  text-align: center;
  margin-bottom: 15px;
}

button {
  padding: 8px 12px;
  margin: 5px;
  border: none;
  background: #333;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

#canvas {
  width: 100%;
  height: 80vh;
  background: white;
  border: 1px solid #ccc;
  position: relative;
  overflow: hidden;
}

.node {
  position: absolute;
  min-width: 120px;
  min-height: 50px;
  padding: 10px;
  background: #e3e3e3;
  border-radius: 8px;
  cursor: move;
}

.node textarea {
  width: 100%;
  height: 100%;
  border: none;
  resize: none;
  background: transparent;
}

svg {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

line {
  stroke: black;
  stroke-width: 2;
}
</style>
</head>
<body>

<h1>Organograma de Sentimentos</h1>

<div id="toolbar">
  <button onclick="addNode()">Adicionar Bloco</button>
  <button onclick="startLink()">Conectar</button>
</div>

<div id="canvas">
  <svg id="lines"></svg>
</div>

<script>
let canvas = document.getElementById('canvas');
let selectedNode = null;
let linking = false;
let firstNode = null;

function addNode() {
  let node = document.createElement('div');
  node.className = 'node';
  node.style.left = '50px';
  node.style.top = '50px';

  let textarea = document.createElement('textarea');
  textarea.placeholder = 'Escreva um sentimento ou pergunta...';
  node.appendChild(textarea);

  canvas.appendChild(node);
  drag(node);

  node.onclick = () => {
    if (linking) {
      if (!firstNode) {
        firstNode = node;
      } else {
        drawLine(firstNode, node);
        firstNode = null;
        linking = false;
      }
    }
  };
}

function drag(el) {
  let offsetX, offsetY;

  el.onmousedown = function(e) {
    offsetX = e.clientX - el.offsetLeft;
    offsetY = e.clientY - el.offsetTop;

    document.onmousemove = function(e) {
      el.style.left = (e.clientX - offsetX) + 'px';
      el.style.top = (e.clientY - offsetY) + 'px';
      updateLines();
    }

    document.onmouseup = function() {
      document.onmousemove = null;
    }
  }
}

function startLink() {
  linking = true;
  firstNode = null;
}

function drawLine(n1, n2) {
  let svg = document.getElementById('lines');
  let line = document.createElementNS('http://www.w3.org/2000/svg', 'line');

  line.setAttribute('data-from', n1.dataset.id);
  line.setAttribute('data-to', n2.dataset.id);

  svg.appendChild(line);
  updateLinePosition(line, n1, n2);
}

function updateLines() {
  let lines = document.querySelectorAll('line');
  lines.forEach(line => {
    let from = line.dataset.from;
    let to = line.dataset.to;
    let n1 = document.querySelector(`[data-id='${from}']`);
    let n2 = document.querySelector(`[data-id='${to}']`);
    if (n1 && n2) updateLinePosition(line, n1, n2);
  });
}

function updateLinePosition(line, n1, n2) {
  let r1 = n1.getBoundingClientRect();
  let r2 = n2.getBoundingClientRect();
  let c = canvas.getBoundingClientRect();

  line.setAttribute('x1', r1.left - c.left + r1.width/2);
  line.setAttribute('y1', r1.top - c.top + r1.height/2);
  line.setAttribute('x2', r2.left - c.left + r2.width/2);
  line.setAttribute('y2', r2.top - c.top + r2.height/2);
}

let idCounter = 0;

function generateId(node) {
  node.dataset.id = 'node-' + idCounter++;
}

// Ajuste para IDs únicos
const originalAddNode = addNode;
addNode = function() {
  originalAddNode();
  let nodes = document.querySelectorAll('.node');
  let last = nodes[nodes.length - 1];
  generateId(last);
};

</script>

</body>
</html>
