<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Linux Study Mode</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Syne:wght@500;700&display=swap');

:root {
  --bg:#13151a;
  --card:#1c1f28;
  --border:#2e3340;
  --accent:#4f8ef7;
  --text:#c8cdd8;
  --muted:#6b7280;
  --cmd:#79c0ff;
  --ok:#38c9a8;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
}

header {
  text-align:center;
  padding:20px;
}

h1 span { color:var(--accent); }

.container {
  max-width:900px;
  margin:auto;
  padding:20px;
}

/* SEARCH */
.search {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  margin-bottom:20px;
}

#list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 10px;
}

/* cada item */
.list-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  transition: 0.2s;
}

.list-item:hover {
  border-color: var(--accent);
  transform: scale(1.02);
}
  
/* deixa mais compacto */
.cmd {
  font-size: 13px;
}

.desc {
  font-size: 12px;
}

/* botão menor */
.copy-btn {
  padding: 4px 8px;
  font-size: 12px;
}
  
.cmd {
  font-family:'JetBrains Mono', monospace;
  color:var(--cmd);
}

.desc {
  color:var(--muted);
  font-size:13px;
}

/* BUTTON */
.copy-btn {
  background:none;
  border:1px solid var(--border);
  color:var(--text);
  padding:5px 10px;
  border-radius:6px;
  cursor:pointer;
}
.copy-btn:hover {
  border-color:var(--accent);
}

/* FLASHCARD */
.flashcard {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:40px;
  text-align:center;
  margin-top:20px;
}

.flashcard .cmd {
  font-size:20px;
}

.hidden {
  display:none;
}

.toggle {
  margin-top:20px;
  cursor:pointer;
  color:var(--accent);
}

/* RESPONSIVO */
@media(max-width:600px){
  .list-item {
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
  }
}
  
@media(max-width:600px){
  #list {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<header>
  <h1>🐧 Linux <span>Study Mode</span></h1>
</header>

<div class="container">

<input class="search" placeholder="🔍 Buscar comando..." oninput="filterCommands(this.value)">

<button onclick="toggleMode()">🎯 Alternar modo estudo</button>

<div id="list"></div>

<div id="flashcard" class="flashcard hidden">
  <div id="flash-cmd" class="cmd"></div>
  <div id="flash-desc" class="desc hidden"></div>
  <div class="toggle" onclick="showAnswer()">Mostrar resposta</div>
</div>

</div>

<script>

const data = [

/* =========================
📁 NAVEGAÇÃO E ARQUIVOS
========================= */
{cmd:"pwd",desc:"mostra o diretório atual"},
{cmd:"ls",desc:"lista arquivos"},
{cmd:"ls -l",desc:"lista detalhada"},
{cmd:"ls -a",desc:"inclui arquivos ocultos"},
{cmd:"cd pasta",desc:"entra no diretório"},
{cmd:"cd ..",desc:"volta um nível"},
{cmd:"cd ~",desc:"vai para a home"},
{cmd:"tree",desc:"estrutura em árvore"},
{cmd:"cp arquivo destino",desc:"copia arquivo"},
{cmd:"mv arquivo destino",desc:"move ou renomeia"},
{cmd:"rm arquivo",desc:"remove arquivo"},
{cmd:"rm -r pasta",desc:"remove pasta"},
{cmd:"rm -f arquivo",desc:"remove sem confirmação"},
{cmd:"mkdir pasta",desc:"cria diretório"},
{cmd:"rmdir pasta",desc:"remove diretório vazio"},
{cmd:"touch arquivo",desc:"cria arquivo vazio"},

/* =========================
🔍 BUSCA
========================= */
{cmd:"find / -name arquivo.txt",desc:"busca arquivo no sistema"},
{cmd:"locate arquivo.txt",desc:"busca rápida indexada"},
{cmd:"updatedb",desc:"atualiza base do locate"},
{cmd:"grep 'texto' arquivo",desc:"busca dentro do arquivo"},
{cmd:"grep -r 'texto' .",desc:"busca recursiva"},
{cmd:"which comando",desc:"caminho do executável"},
{cmd:"whereis comando",desc:"localização do binário"},

/* =========================
📄 VISUALIZAÇÃO
========================= */
{cmd:"cat arquivo",desc:"exibe conteúdo"},
{cmd:"less arquivo",desc:"visualização paginada"},
{cmd:"more arquivo",desc:"visualização simples"},
{cmd:"head -n 10 arquivo",desc:"primeiras linhas"},
{cmd:"tail -n 10 arquivo",desc:"últimas linhas"},
{cmd:"tail -f log.txt",desc:"acompanha logs em tempo real"},

/* =========================
📦 APT
========================= */
{cmd:"sudo apt update",desc:"atualiza lista de pacotes"},
{cmd:"sudo apt upgrade",desc:"atualiza sistema"},
{cmd:"sudo apt install pacote",desc:"instala pacote"},
{cmd:"sudo apt remove pacote",desc:"remove pacote"},
{cmd:"sudo apt purge pacote",desc:"remove com configs"},
{cmd:"sudo apt autoremove",desc:"remove dependências"},
{cmd:"apt search nome",desc:"busca pacote"},
{cmd:"apt show pacote",desc:"detalhes do pacote"},

/* =========================
👤 USUÁRIOS
========================= */
{cmd:"whoami",desc:"usuário atual"},
{cmd:"id",desc:"informações do usuário"},
{cmd:"adduser nome",desc:"cria usuário"},
{cmd:"deluser nome",desc:"remove usuário"},
{cmd:"passwd",desc:"altera senha"},
{cmd:"chmod 755 arquivo",desc:"altera permissões"},
{cmd:"chown user:grupo arquivo",desc:"altera dono"},

/* =========================
⚙️ SISTEMA
========================= */
{cmd:"top",desc:"monitor de processos"},
{cmd:"htop",desc:"monitor avançado"},
{cmd:"ps aux",desc:"lista processos"},
{cmd:"kill PID",desc:"encerra processo"},
{cmd:"kill -9 PID",desc:"força encerramento"},
{cmd:"uptime",desc:"tempo ligado"},
{cmd:"free -h",desc:"uso de memória"},
{cmd:"df -h",desc:"uso de disco"},
{cmd:"du -sh pasta",desc:"tamanho da pasta"},

/* =========================
🌐 REDE
========================= */
{cmd:"ping google.com",desc:"testa conexão"},
{cmd:"ifconfig",desc:"configuração de rede (antigo)"},
{cmd:"ip a",desc:"mostra IP"},
{cmd:"netstat -tuln",desc:"portas abertas"},
{cmd:"ss -tuln",desc:"substituto do netstat"},
{cmd:"curl site.com",desc:"requisição HTTP"},
{cmd:"wget url",desc:"download de arquivo"},

/* =========================
📦 COMPACTAÇÃO
========================= */
{cmd:"tar -cvf arquivo.tar pasta",desc:"cria tar"},
{cmd:"tar -xvf arquivo.tar",desc:"extrai tar"},
{cmd:"tar -czvf arquivo.tar.gz pasta",desc:"compacta gzip"},
{cmd:"tar -xzvf arquivo.tar.gz",desc:"extrai gzip"},
{cmd:"zip -r arquivo.zip pasta",desc:"compacta zip"},
{cmd:"unzip arquivo.zip",desc:"extrai zip"},

/* =========================
💽 DISCO
========================= */
{cmd:"lsblk",desc:"lista discos"},
{cmd:"mount",desc:"monta disco"},
{cmd:"umount",desc:"desmonta disco"},
{cmd:"fdisk -l",desc:"lista partições"},

/* =========================
🕒 DATA
========================= */
{cmd:"date",desc:"data atual"},
{cmd:"cal",desc:"calendário"},
{cmd:"timedatectl",desc:"configura hora"},

/* =========================
⌨️ HISTÓRICO
========================= */
{cmd:"history",desc:"histórico"},
{cmd:"clear",desc:"limpa terminal"},
{cmd:"!!",desc:"repete último comando"},
{cmd:"!n",desc:"executa comando do histórico"},

/* =========================
🔀 REDIRECIONAMENTO
========================= */
{cmd:"comando > arquivo",desc:"sobrescreve saída"},
{cmd:"comando >> arquivo",desc:"adiciona saída"},
{cmd:"comando < arquivo",desc:"entrada"},
{cmd:"comando1 | comando2",desc:"pipe"},

/* =========================
🧠 SHELL
========================= */
{cmd:"echo $HOME",desc:"mostra variável"},
{cmd:"export VAR=valor",desc:"define variável"},
{cmd:"env",desc:"lista variáveis"},

/* =========================
🚀 EXECUÇÃO
========================= */
{cmd:"chmod +x script.sh",desc:"torna executável"},
{cmd:"./script.sh",desc:"executa script"},

/* =========================
🔄 SERVIÇOS
========================= */
{cmd:"systemctl start serviço",desc:"inicia serviço"},
{cmd:"systemctl stop serviço",desc:"para serviço"},
{cmd:"systemctl restart serviço",desc:"reinicia"},
{cmd:"systemctl status serviço",desc:"status"},
{cmd:"systemctl enable serviço",desc:"ativa no boot"},
{cmd:"systemctl disable serviço",desc:"desativa"},

/* =========================
🐘 POSTGRESQL (EXTRA)
========================= */
{cmd:"psql -U postgres",desc:"acessa PostgreSQL"},
{cmd:"psql -h localhost -U user db",desc:"conecta ao banco"},
{cmd:"\\l",desc:"lista bancos"},
{cmd:"\\c banco",desc:"conecta ao banco"},
{cmd:"\\dt",desc:"lista tabelas"},
{cmd:"\\d tabela",desc:"estrutura da tabela"},
{cmd:"\\q",desc:"sair do psql"},
{cmd:"createdb nome",desc:"cria banco"},
{cmd:"dropdb nome",desc:"remove banco"},
{cmd:"createuser nome",desc:"cria usuário"},
{cmd:"dropuser nome",desc:"remove usuário"},
{cmd:"pg_dump db > backup.sql",desc:"backup banco"},
{cmd:"psql db < backup.sql",desc:"restore banco"},

/* =========================
📚 AJUDA
========================= */
{cmd:"man comando",desc:"manual completo"},
{cmd:"comando --help",desc:"ajuda rápida"}

];

let studyMode = false;
let current = 0;

function renderList(filter=""){
  const list = document.getElementById("list");
  list.innerHTML = "";

  data
    .filter(c => 
    c.cmd.toLowerCase().includes(filter) || 
    c.desc.toLowerCase().includes(filter))
    .forEach(c => {
      list.innerHTML += `
        <div class="list-item">
          <div>
            <div class="cmd">${c.cmd}</div>
            <div class="desc">${c.desc}</div>
          </div>
          <button class="copy-btn" onclick="copy('${c.cmd}')">📋</button>
        </div>
      `;
    });
}

function filterCommands(text){
  renderList(text.toLowerCase());
}

function copy(btn){
  const text = btn.getAttribute("data-cmd");
  navigator.clipboard.writeText(text);
}

/* FLASHCARD */

function toggleMode(){
  studyMode = !studyMode;

  document.getElementById("list").classList.toggle("hidden", studyMode);
  document.getElementById("flashcard").classList.toggle("hidden", !studyMode);

  nextCard();
}

function nextCard(){
  current = Math.floor(Math.random() * data.length);
  document.getElementById("flash-cmd").innerText = data[current].cmd;
  document.getElementById("flash-desc").innerText = data[current].desc;
  document.getElementById("flash-desc").classList.add("hidden");
}

function showAnswer(){
  const desc = document.getElementById("flash-desc");
  desc.classList.remove("hidden");
  setTimeout(nextCard,2000);
}

/* INIT */
renderList();

</script>

</body>
</html>
